[config.site]
title = "张胖胖"
description = "记录计算机大学生在 AI 浪潮下的学习、实践与探索。"
pageTitle = "张胖胖｜大模型与 Agent 开发"
pageDescription = "张胖胖的个人网站，收录全栈实践、技术文章与独立项目。"
url = "https://zhangpangpang.dev"
repository = "https://github.com/JianWeiCat/portfolio"
footerNote = "© 2026 张胖胖。Built with Astro and Navfolio."

[config.theme]
# 可用色盘：green-soft、green-vivid、rose-soft、pink-soft、purple-soft、blue-soft、orange-soft、brown-soft
palette = "blue-soft"
lang = "zh-CN"

[config.fonts]
en = "Maple Mono"
code = "Monaco"
zh = "ChillRoundM"
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索文章…"
maxResults = 6

[config.pages.blog]
title = "文章"
kicker = "学习笔记"
subtitle = "全栈实践、AI 与 Agent 开发记录。"
note = "记录学习路上的思考、踩坑和持续进行中的实验。"
postsPerPage = 6
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "浏览文章"
subtitle = ""
note = "按主题整理的学习记录。"

[config.pages.blog.series]
title = "系列"
kicker = "专题阅读"
subtitle = ""
note = "可以按顺序阅读的专题文章。"

[config.pages.projects]
title = "项目"
kicker = "作品集"
subtitle = "全栈应用、工具与探索性实验。"
note = "从想法到实现，记录值得复盘的项目与技术选择。"

[config.profile]
name = "张胖胖"
handle = "@zhangpangpang"
role = "全栈工程师 · NUIST 计软院在读大学生"
email = "zhangjianwei675@foxmail.com"
website = "https://zhangpangpang.dev"
github = "https://github.com/JianWeiCat"
